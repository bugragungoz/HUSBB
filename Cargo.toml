[package]
name = "husbb"
version = "0.1.0"
edition = "2024"
description = "HUSBB - Hantek DSO2D15 USB Bridge: live two-channel PC screen for the Hantek DSO2D15 oscilloscope"
license = "MIT"
repository = "https://github.com/bugragungoz/HUSBB"
authors = ["bugragungoz"]
readme = "README.md"
build = "build.rs"
keywords = ["oscilloscope", "hantek", "dso2d15", "usbtmc", "scpi"]
categories = ["science", "hardware-support"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "system_fonts", "accesskit", "persistence"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.9.0"
log = "0.4.35"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[lib]
name = "husbb"
path = "src/lib.rs"

[[bin]]
name = "HUSBB"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
